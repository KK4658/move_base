# # #footprint: [[0.175, 0.175], [0.175, -0.175], [-0.175, -0.175], [-0.175, 0.175]]  
# # #footprint参数用来设置机器人在二维地图上的占用面积，参数以机器人的中心作为坐标原点
# robot_radius: 0.25 #如果机器人外观是圆形的则需要设置该参数，footprint参数就不用设置
# inflation_radius: 0.5 #这个参数表示机器人路径规划应与机器人保持0.1m以上的安全距离
# obstacle_range: 1.0  #设置机器人检测障碍物的最大距离
# raytrace_range: 6.0  #设置机器人检测自由空间的最大范围
# # max_obstacle_height: 0.6  #这两个参数用于描述障碍物的最大高度和最小高度
# # min_obstacle_height: 0.0
# observation_sources: base_lidar
# base_lidar: {
#     data_type: PointCloud2,
#     topic: /livox/pointcloud, 
#     marking: true, 
#     clearing: true
#     }




robot_radius: 0.25
inflation_radius: 0.5
obstacle_range: 1.0
raytrace_range: 6.0
observation_sources: base_lidar
base_lidar: {
    data_type: LaserScan,
    topic: /lidar2D/scan, 
    marking: true, 
    clearing: true
    }